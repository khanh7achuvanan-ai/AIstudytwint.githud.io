<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AI Study Twin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>AI Study Twin</h1>

    <select id="subjectSelector">
        <option value="english">Tiếng Anh</option>
        <option value="math">Toán</option>
        <option value="physics">Vật Lý</option>
    </select>

    <div class="card">
        <h3>Daily Insight</h3>
        <p id="dailyTip">Chọn môn học để xem insight</p>
    </div>

    <div class="card">
        <h3>Predictive Roadmap</h3>
        <canvas id="roadmapChart"></canvas>
    </div>

    <div class="card">
        <h3>AI Tutor</h3>
        <input type="text" id="questionInput" placeholder="Nhập câu hỏi...">
        <button id="askBtn">Gửi</button>
        <div id="chatBox"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
