<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AI Study Twin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header>
    <div class="header-top">
        <h1>AI Study Twin</h1>

        <!-- SUBJECT SWITCHER -->
        <select id="subjectSelector">
            <option value="math">Toán</option>
            <option value="english">Tiếng Anh</option>
            <option value="physics">Vật Lý</option>
        </select>
    </div>
    <p class="subtitle">Predictive Learning & Digital Twin Intelligence</p>
</header>

<div class="dashboard">

    <!-- LEFT PANEL -->
    <div class="glass-panel">
        <h2>🧠 Daily Insight</h2>

        <div class="tip-box" id="dailyTip"></div>

        <div class="bio-sync">
            <span>❤️ Nhịp tim</span>
            <b id="heartRate">72 bpm</b>
        </div>

        <div class="bio-sync">
            <span>⚡ Tập trung</span>
            <b id="focusLevel">85%</b>
        </div>
    </div>

    <!-- CENTER PANEL -->
    <div class="glass-panel">
        <h2>🤖 Digital Twin</h2>

        <div class="twin-container">
            <div class="digital-twin" id="twinAvatar">🤖</div>
            <div class="twin-status" id="twinStatus">
                Hệ thống đồng bộ ổn định
            </div>
        </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="glass-panel">
        <h2>💬 AI Tutor Lab</h2>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Nhập câu hỏi...">
            <button id="searchBtn">Scan</button>
        </div>

        <div class="tutor-chat" id="chatBox"></div>
    </div>

    <!-- FULL WIDTH -->
    <div class="glass-panel roadmap-panel">
        <h2>📈 Predictive Roadmap</h2>
        <canvas id="roadmapChart"></canvas>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
